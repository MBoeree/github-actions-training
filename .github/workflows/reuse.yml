name: Reuse other workflow

on: 
  - workflow_dispatch

permissions:
  contents: read

jobs:
  call-workflow:
    uses: '$/.github/workflows/reusable.yml'
    with:
      who-to-greet: '@MBoeree'
  use-output:
    runs-on: ubuntu-26.04
    needs: 
      - call-workflow
    steps:
      - run: echo "current time is $(jobs.call-workflow.current-time)"
      
